#cloud-config
# GitLab Primary Server Cloud-Init Configuration

package_update: true
package_upgrade: true

packages:
  - curl
  - openssh-server
  - ca-certificates
  - tzdata
  - perl
  - postfix
  - borgbackup
  - jq
  - htop
  - fail2ban
  # sshpass: needed once, by setup-borg-backup.sh and setup-borg-append-only.sh,
  # to SFTP the sub-account's authorized_keys file using its initial password.
  # After append-only is enabled and the operator rotates the password in the
  # Hetzner Console, sshpass is no longer needed (Borg uses SSH key auth).
  - sshpass

# Create necessary directories
runcmd:
  # Wait for volumes to be attached
  - sleep 30

  # Format and mount data volume if not already formatted
  - |
    DATA_DEVICE="/dev/disk/by-id/scsi-0HC_Volume_${data_volume_id}"
    if ! blkid "$DATA_DEVICE" | grep -q ext4; then
      mkfs.ext4 -L gitlab-data "$DATA_DEVICE"
    fi
    mkdir -p /var/opt/gitlab
    echo "$DATA_DEVICE /var/opt/gitlab ext4 defaults,nofail 0 2" >> /etc/fstab
    mount /var/opt/gitlab

  # Format and mount backup volume
  - |
    BACKUP_DEVICE="/dev/disk/by-id/scsi-0HC_Volume_${backup_volume_id}"
    if ! blkid "$BACKUP_DEVICE" | grep -q ext4; then
      mkfs.ext4 -L gitlab-backups "$BACKUP_DEVICE"
    fi
    mkdir -p /var/opt/gitlab/backups
    echo "$BACKUP_DEVICE /var/opt/gitlab/backups ext4 defaults,nofail 0 2" >> /etc/fstab
    mount /var/opt/gitlab/backups

  # Install GitLab CE (version pinned via seed.yaml -> gitlab_version).
  # The repo-install script is vendored at scripts/vendor/install-gitlab-repo.sh
  # and dropped on disk via the write_files entry below (encoding: b64).
  # Checksum is verified in CI on every push. Security review T1.6 (2026-05-15)
  # — closes the `curl … | bash` anti-pattern.
  - bash /usr/local/bin/install-gitlab-repo.sh
  - EXTERNAL_URL="https://${gitlab_domain}" apt-get install -y "gitlab-ce=${gitlab_version}"
  # Hold the package so unattended-upgrades does not roll us forward silently
  - apt-mark hold gitlab-ce

  # Enable and configure fail2ban
  - systemctl enable fail2ban
  - systemctl start fail2ban

  # Set secure permissions
  - chmod 600 /etc/gitlab/gitlab.rb
  - chmod 600 /etc/gitlab/gitlab-secrets.json

write_files:
  # Vendored packages.gitlab.com repo-install script (T1.6).
  # The content is the verbatim upstream script, base64-encoded by Terraform
  # at apply time from scripts/vendor/install-gitlab-repo.sh. Checksum is
  # verified by CI; refresh procedure in scripts/vendor/README.md.
  - path: /usr/local/bin/install-gitlab-repo.sh
    permissions: '0755'
    encoding: b64
    content: ${install_gitlab_repo_sh_b64}

  # GitLab backup script
  - path: /usr/local/bin/gitlab-backup-to-borg.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      # GitLab backup script with BorgBackup
      # Run hourly via cron

      set -euo pipefail

      LOG_FILE="/var/log/gitlab-backup.log"
      BACKUP_DIR="/var/opt/gitlab/backups"

      # Source Borg configuration
      if [[ -f /etc/gitlab-backup.conf ]]; then
        source /etc/gitlab-backup.conf
      else
        echo "$(date): ERROR - /etc/gitlab-backup.conf not found" >> "$$LOG_FILE"
        exit 1
      fi

      echo "$(date): Starting GitLab backup" >> "$$LOG_FILE"

      # Create GitLab backup (skip artifacts/LFS as they're in object storage)
      gitlab-backup create STRATEGY=copy SKIP=artifacts,lfs >> "$$LOG_FILE" 2>&1

      # Find the latest backup file
      LATEST_BACKUP=$(ls -t "$$BACKUP_DIR"/*_gitlab_backup.tar 2>/dev/null | head -1)

      if [[ -z "$$LATEST_BACKUP" ]]; then
        echo "$(date): ERROR - No backup file found" >> "$$LOG_FILE"
        exit 1
      fi

      echo "$(date): Sending backup to Borg repository" >> "$$LOG_FILE"

      # Send to BorgBackup
      borg create --stats --compression zstd \
        "$${BORG_REPO}::{hostname}-{now:%Y-%m-%d_%H:%M}" \
        "$$LATEST_BACKUP" \
        /etc/gitlab/gitlab.rb \
        /etc/gitlab/gitlab-secrets.json \
        >> "$$LOG_FILE" 2>&1

      # Prune old backups using retention from /etc/gitlab-backup.conf
      # (generated from seed.yaml via `seed_bootstrap.py --target borg-conf`)
      borg prune \
        --keep-hourly="$${BACKUP_KEEP_HOURLY:-24}" \
        --keep-daily="$${BACKUP_KEEP_DAILY:-7}" \
        --keep-weekly="$${BACKUP_KEEP_WEEKLY:-4}" \
        --keep-monthly="$${BACKUP_KEEP_MONTHLY:-12}" \
        "$$BORG_REPO" >> "$$LOG_FILE" 2>&1

      # Clean local backups older than 24 hours
      find "$$BACKUP_DIR" -name "*_gitlab_backup.tar" -mtime +1 -delete

      echo "$(date): Backup completed successfully" >> "$$LOG_FILE"

  # Borg configuration template (to be filled in manually)
  - path: /etc/gitlab-backup.conf.template
    permissions: '0600'
    content: |
      # BorgBackup configuration
      # Copy this to /etc/gitlab-backup.conf and fill in values
      export BORG_REPO="ssh://uXXXXX@uXXXXX.your-storagebox.de:23/./gitlab-borg"
      export BORG_PASSPHRASE="<your-secure-passphrase>"
      export BORG_RSH="ssh -i /root/.ssh/storagebox_key -o StrictHostKeyChecking=accept-new"

  # Cron job for hourly backups
  - path: /etc/cron.d/gitlab-backup
    permissions: '0644'
    content: |
      # GitLab backup - runs hourly
      0 * * * * root /usr/local/bin/gitlab-backup-to-borg.sh

  # Fail2ban: SSH brute-force protection (security review T2.3, 2026-05-15)
  # Uses the built-in `sshd` filter shipped by fail2ban; no custom filter needed.
  # backend=systemd reads from the systemd journal — works on Ubuntu 24.04 even
  # when /var/log/auth.log isn't created by rsyslog.
  - path: /etc/fail2ban/jail.d/sshd.conf
    permissions: '0644'
    content: |
      [sshd]
      enabled = true
      port = ssh
      backend = systemd
      maxretry = 5
      findtime = 600
      bantime = 3600

  # Fail2ban GitLab configuration
  - path: /etc/fail2ban/jail.d/gitlab.conf
    permissions: '0644'
    content: |
      [gitlab]
      enabled = true
      port = http,https
      filter = gitlab
      logpath = /var/log/gitlab/gitlab-rails/application.log
      maxretry = 10
      findtime = 600
      bantime = 3600

  - path: /etc/fail2ban/filter.d/gitlab.conf
    permissions: '0644'
    content: |
      [Definition]
      failregex = Failed Login: username=.* ip=<HOST>
      ignoreregex =

final_message: "GitLab server provisioned in $UPTIME seconds"
