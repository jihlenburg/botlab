name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history so gitleaks can scan all commits, not just HEAD
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # GITHUB_TOKEN is automatically provided; allows reporting
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fail the job on any leak (no warn-only)
          GITLEAKS_NOTIFY_USER_LIST: ""

  lint-shell:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck on scripts
        run: |
          # Non-recursive glob: scripts/vendor/ is excluded by design.
          # Vendored upstream files are pinned by checksum, not lint-clean.
          shellcheck scripts/*.sh

  verify-vendored-checksums:
    # Closes security review T1.6 — ensures the vendored packages.gitlab.com
    # repo-install script (and any future vendored file) has not drifted from
    # the version that was audited. If this fails, refresh per
    # scripts/vendor/README.md.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify vendored file checksums
        working-directory: scripts/vendor
        run: sha256sum -c CHECKSUMS

  validate-terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  validate-seed:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pydantic pyyaml

      - name: Validate seed.template.yaml shape
        # seed.template.yaml contains SECRET:* placeholders; we only check the
        # schema accepts the shape, not that secrets are real.
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from seed_schema import SeedConfig
          import yaml
          raw = yaml.safe_load(open("seed.template.yaml"))
          try:
              SeedConfig(**raw)
          except ValueError as exc:
              msg = str(exc)
              if "Placeholder secrets still present" not in msg:
                  print("Unexpected schema error:", msg)
                  sys.exit(1)
          print("seed.template.yaml shape OK")
          PY
