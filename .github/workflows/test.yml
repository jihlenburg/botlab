name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-shell:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck on scripts
        run: |
          shellcheck scripts/*.sh

  validate-terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  validate-seed:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pydantic pyyaml

      - name: Validate seed.example.yaml shape
        # seed.example.yaml contains SECRET:* placeholders; we only check the
        # schema accepts the shape, not that secrets are real.
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from seed_schema import SeedConfig
          import yaml
          raw = yaml.safe_load(open("seed.example.yaml"))
          try:
              SeedConfig(**raw)
          except ValueError as exc:
              msg = str(exc)
              if "Placeholder secrets still present" not in msg:
                  print("Unexpected schema error:", msg)
                  sys.exit(1)
          print("seed.example.yaml shape OK")
          PY
