# =============================================================================
# Seed Configuration - Single Source of Truth
# =============================================================================
# This file contains EVERY value needed to bootstrap the full ACME GitLab
# infrastructure from scratch. Copy to seed.yaml and fill in real values.
#
# SECURITY: seed.yaml contains secrets. Store it encrypted (sops/age) or
# in a password manager. NEVER commit seed.yaml to version control.
#
# Usage:
#   cp seed.example.yaml seed.yaml
#   # Edit seed.yaml with real values
#   python scripts/seed_bootstrap.py seed.yaml --validate
#   python scripts/seed_bootstrap.py seed.yaml --target all
#
# DR Bootstrap:
#   1. Decrypt seed.yaml (from vault/USB/password manager)
#   2. python scripts/seed_bootstrap.py seed.yaml --target all
#   3. cd terraform && terraform apply
#   4. SSH to GitLab server -> run restore-gitlab.sh
#   5. Verify: curl https://<gitlab-domain>/-/health

version: 1

# =============================================================================
# Organization
# =============================================================================
organization:
  name: "ACME Corp"
  admin_email: "SECRET:admin-email"           # e.g. admin@yourcompany.com
  environment: "prod"                          # prod | staging | dev
  labels:
    project: "acme-gitlab"
    managed_by: "terraform"

# =============================================================================
# Infrastructure (Hetzner Cloud)
# =============================================================================
infrastructure:
  hetzner:
    api_token: "SECRET:hetzner-api-token"      # from console.hetzner.cloud
    location: "fsn1"                           # fsn1 | nbg1 | hel1
  servers:
    gitlab:
      type: "cpx31"
      image: "ubuntu-24.04"
      private_ip: "10.0.1.10"
  network:
    cidr: "10.0.0.0/16"
    subnet_cidr: "10.0.1.0/24"
  storage:
    gitlab_data_volume_gb: 200
    gitlab_backup_volume_gb: 100
  ssh:
    admin_keys:
      alice: "SECRET:ssh-public-key-alice"     # ssh-ed25519 AAAAC3... alice@example.com
    trusted_ips:
      - "203.0.113.10/32"                      # Office/VPN IP in CIDR notation

# =============================================================================
# GitLab
# =============================================================================
gitlab:
  domain: "SECRET:gitlab-domain"               # e.g. gitlab.yourcompany.com
  # Pin to a specific GitLab CE version. Format is the apt package version
  # (omnibus); see https://packages.gitlab.com/gitlab/gitlab-ce for the list.
  # Update deliberately after reading release notes and running the upgrade
  # runbook in docs/DESIGN.md §5.6.
  version: "17.10.0-ce.0"
  # No global private_token field. Cron jobs that need GitLab API access
  # generate their own scoped tokens on demand and load them via
  # systemd-creds. See DESIGN.md Appendix C ("Layered Secrets Management").

# =============================================================================
# Backup (BorgBackup + Hetzner Storage Box)
# =============================================================================
backup:
  storage_box:
    # ----- Provisioning intent (filled in BEFORE first `terraform apply`) ----
    # Hetzner Storage Boxes are now in the Cloud Console (not Robot) and are
    # provisioned by Terraform via the hcloud provider (v1.63.0+, May 2026).
    # See docs/DEPLOY.md §1 and terraform/storage_box.tf.
    name: "acme-gitlab-backups"                # cosmetic label in Hetzner console
    type: "bx21"                                # bx11 / bx21 / bx31 / bx41 — bx21 (5TB) recommended floor
    location: "fsn1"                            # fsn1 / nbg1 / hel1 — usually same as the GitLab server
    password: "SECRET:storage-box-password"     # `openssl rand -base64 24` — emergency Hetzner Console access only
    subaccount_password: "SECRET:storage-box-subaccount-password"  # `openssl rand -base64 24` — used once by setup-borg-append-only.sh
    ssh_public_key: "SECRET:storage-box-offline-ssh-public-key"    # OFFLINE full-access pubkey; private half ONLY in recovery kit

    # ----- Runtime values (filled in AFTER `terraform apply`) ---------------
    # These come back as Terraform OUTPUTS — Hetzner assigns the FQDN and
    # username at create time. After apply, run:
    #   terraform -chdir=terraform output storage_box_post_apply
    # and paste the two values below. Then re-run --target borg-conf.
    host: ""                                    # e.g. uXXXXX-subN.your-storagebox.de
    user: ""                                    # e.g. uXXXXX-subN
  borg:
    passphrase: "SECRET:borg-passphrase"       # minimum 20 characters
  retention:
    keep_hourly: 24
    keep_daily: 7
    keep_weekly: 4
    keep_monthly: 12                           # 12 months (addresses delayed ransomware activation)
  s3:
    enabled: false                             # Set to true to enable S3 immutable backups
    endpoint: "SECRET:s3-endpoint"             # e.g. s3.us-west-002.backblazeb2.com
    bucket: "SECRET:s3-bucket"                 # e.g. gitlab-immutable-backups
    access_key: "SECRET:s3-access-key"
    secret_key: "SECRET:s3-secret-key"
    retention_days: 90                         # Object Lock retention period
  local_backup_path: "/var/opt/gitlab/backups"
  max_backup_age_hours: 4

# =============================================================================
# Alerting (Alertmanager)
# =============================================================================
# These values are consumed by Alertmanager (email receiver) and by any
# cron-emitted notifications that bypass Alertmanager. Alert thresholds are
# defined in monitoring/alerts.yml, not here.
alerting:
  email:
    enabled: true
    smtp_host: "smtp.office365.com"
    smtp_port: 587
    smtp_user: "SECRET:smtp-user"              # e.g. gitlab-noreply@example.com
    smtp_password: "SECRET:smtp-password"
    from_address: "SECRET:email-from"          # e.g. gitlab-alerts@example.com
    recipients:
      - "SECRET:alert-recipient"               # e.g. admin@example.com
  webhook:
    enabled: false
    url: ""
  cooldown_minutes: 60
